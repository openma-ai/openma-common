# Every line a pull request adds or changes must be covered by tests.
# The project status is informational: older modules are below 100%.
coverage:
  status:
    patch:
      default:
        target: 100%
        threshold: 0%
    project:
      default:
        informational: true
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
