name: Release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate tag, release notes, and dist
        run: node scripts/release-check.mjs --tag
