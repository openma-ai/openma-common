name: CI heavy

# Post-merge home for the heavy suites. The Windows verify and the Playwright
# chat-interactive-surface checks run on every code-carrying push to main, on
# demand on a pull request carrying the `full-ci` label, and manually through
# workflow_dispatch. A failed post-merge or dispatched run opens or updates a
# `ci-failure` issue linking the run and the commit.

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ci-heavy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists changed files through the Pulls API on pull_request.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/checkout@v4

      - name: Detect code-path changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # 'some' ignores '!' patterns; 'some-with-excludes' makes a file
          # match only when it hits at least one pattern and no negated one.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!artifacts/**"
              - "!*.md"
              - "!LICENSE"

      - name: Resolve the code flag
        id: resolve
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          # No diff context (dispatch): run everything.
          echo "code=${FILTER_CODE:-true}" >> "$GITHUB_OUTPUT"

  verify-windows:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install a Python interpreter for uvx tests
        run: uv python install 3.12
      - name: Add Git gzip, bzip2, and OpenSSL to PATH
        shell: pwsh
        run: |
          $gitUsr = "C:\Program Files\Git\usr\bin"
          foreach ($tool in @("gzip.exe", "bzip2.exe", "openssl.exe")) {
            if (-not (Test-Path (Join-Path $gitUsr $tool))) {
              throw "Missing $tool in $gitUsr"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
      - name: Install official xz
        shell: pwsh
        run: |
          # windows-2025 Git for Windows ships gzip, bzip2, and openssl under
          # usr\bin, and does not ship xz.exe there or in mingw64\bin.
          # Chocolatey community has no xz package. Use the official XZ Utils
          # Windows build and keep it off the Git/MSYS tool directories.
          $gitXz = @(
            "C:\Program Files\Git\usr\bin\xz.exe",
            "C:\Program Files\Git\mingw64\bin\xz.exe"
          )
          foreach ($candidate in $gitXz) {
            if (Test-Path $candidate) { Write-Host "Git also has $candidate" }
            else { Write-Host "Not present: $candidate" }
          }
          $version = "5.8.4"
          $expected = "f31af7638391ecf286d48bc8555ce6e131691a1c52a9e44303bce57069e9de56"
          $zip = Join-Path $env:RUNNER_TEMP "xz-windows.zip"
          $dest = Join-Path $env:RUNNER_TEMP "xz"
          Invoke-WebRequest -Uri "https://github.com/tukaani-project/xz/releases/download/v$version/xz-$version-windows.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "xz zip checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest
          $bin = Join-Path $dest "bin_x86-64"
          $xz = Join-Path $bin "xz.exe"
          if (-not (Test-Path $xz)) { throw "xz.exe missing from $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & $xz --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  verify-chat-ui-surface:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium for chat UI surface checks
        run: pnpm exec playwright install chromium
      - name: Verify chat UI interactive surface states
        run: pnpm verify:chat-ui-interactive-surface
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/chat-ui-interactive-surface
      - name: Upload chat UI interactive surface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-ui-interactive-surface-${{ github.run_id }}
          path: artifacts/chat-ui-interactive-surface/
          if-no-files-found: warn

  report-failure:
    name: Report post-merge failure
    needs:
      - changes
      - verify-windows
      - verify-chat-ui-surface
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the post-merge failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          label="ci-failure"
          marker="Post-merge CI failure: ${WORKFLOW_NAME}"
          failed=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          gh label create "$label" --repo "$REPO" --color d93f0b --description "Post-merge CI failure" --force
          body=$(printf '%s\n' \
            "A post-merge CI run failed." \
            "" \
            "- Run: ${RUN_URL}" \
            "- Commit: ${SHA}" \
            "- Failed jobs: ${failed:-unknown}" \
            "" \
            "This issue updates on every repeat failure; close it once a later main run is green.")
          existing=$(gh issue list --repo "$REPO" --state open --label "$label" --limit 50 --json number,title \
            --jq "[.[] | select(.title | contains(\"${marker}\"))][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "updated issue #${existing}"
          else
            gh issue create --repo "$REPO" --title "${marker} @ ${SHA:0:7}" --body "$body" --label "$label"
          fi
