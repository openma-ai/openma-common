name: CI

# Fast path only: the Linux verify (tests, typecheck, build, dist freshness,
# coverage for the Codecov patch check) and the PR-scoped release gate on every
# change that can affect them. The Windows verify and the Playwright
# chat-interactive-surface suite moved to ci-heavy.yml — they run post-merge on
# main, on a pull request carrying the `full-ci` label, or manually through
# workflow_dispatch.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter lists changed files through the Pulls API on pull_request.
  pull-requests: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skipped jobs report success, so a docs-only pull request stays mergeable
  # without burning runner minutes on work it cannot affect.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/checkout@v4

      - name: Detect code-path changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # 'some' ignores '!' patterns; 'some-with-excludes' makes a file
          # match only when it hits at least one pattern and no negated one.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!artifacts/**"
              - "!*.md"
              - "!LICENSE"

      - name: Resolve the code flag
        id: resolve
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          # No diff context (dispatch, tag push): run everything.
          echo "code=${FILTER_CODE:-true}" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install a Python interpreter for uvx tests
        run: uv python install 3.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify turn projector performance
        run: pnpm test:perf
      - name: Verify acp-fork browser bundle
        run: node scripts/verify-acp-fork-browser.mjs
      - name: Verify committed build output is current
        run: git diff --exit-code -- dist
      - name: Measure test coverage
        run: pnpm test:coverage
      # codecov.yml requires 100% coverage of the lines a pull request changes.
      # The upload is best effort: without a CODECOV_TOKEN secret, or with
      # Codecov unreachable, this step must not turn the build red.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch the base branch and tags
        run: |
          git fetch --no-recurse-submodules origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git fetch --tags --force origin
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release notes, version bump, and dist
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/release-check.mjs
