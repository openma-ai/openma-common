name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install a Python interpreter for uvx tests
        run: uv python install 3.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify acp-fork browser bundle
        run: node scripts/verify-acp-fork-browser.mjs
      - name: Verify committed build output is current
        run: git diff --exit-code -- dist
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"

  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch the base branch and tags
        run: |
          git fetch --no-recurse-submodules origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git fetch --tags --force origin
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release notes, version bump, and dist
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/release-check.mjs

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install a Python interpreter for uvx tests
        run: uv python install 3.12
      - name: Add Git gzip, bzip2, and OpenSSL to PATH
        shell: pwsh
        run: |
          $gitUsr = "C:\Program Files\Git\usr\bin"
          foreach ($tool in @("gzip.exe", "bzip2.exe", "openssl.exe")) {
            if (-not (Test-Path (Join-Path $gitUsr $tool))) {
              throw "Missing $tool in $gitUsr"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
      - name: Install official xz
        shell: pwsh
        run: |
          # windows-2025 Git for Windows ships gzip, bzip2, and openssl under
          # usr\bin, and does not ship xz.exe there or in mingw64\bin.
          # Chocolatey community has no xz package. Use the official XZ Utils
          # Windows build and keep it off the Git/MSYS tool directories.
          $gitXz = @(
            "C:\Program Files\Git\usr\bin\xz.exe",
            "C:\Program Files\Git\mingw64\bin\xz.exe"
          )
          foreach ($candidate in $gitXz) {
            if (Test-Path $candidate) { Write-Host "Git also has $candidate" }
            else { Write-Host "Not present: $candidate" }
          }
          $version = "5.8.4"
          $expected = "f31af7638391ecf286d48bc8555ce6e131691a1c52a9e44303bce57069e9de56"
          $zip = Join-Path $env:RUNNER_TEMP "xz-windows.zip"
          $dest = Join-Path $env:RUNNER_TEMP "xz"
          Invoke-WebRequest -Uri "https://github.com/tukaani-project/xz/releases/download/v$version/xz-$version-windows.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "xz zip checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest
          $bin = Join-Path $dest "bin_x86-64"
          $xz = Join-Path $bin "xz.exe"
          if (-not (Test-Path $xz)) { throw "xz.exe missing from $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & $xz --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
