name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install a Python interpreter for uvx tests
        run: uv python install 3.12
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify committed build output is current
        run: git diff --exit-code -- dist
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install a Python interpreter for uvx tests
        run: uv python install 3.12
      - name: Add Git gzip, bzip2, and OpenSSL to PATH
        shell: pwsh
        run: |
          $gitUsr = "C:\Program Files\Git\usr\bin"
          foreach ($tool in @("gzip.exe", "bzip2.exe", "openssl.exe")) {
            if (-not (Test-Path (Join-Path $gitUsr $tool))) {
              throw "Missing $tool in $gitUsr"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
      - name: Install xz
        shell: pwsh
        run: choco install xz --no-progress -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
